<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vani — Feedback</title>
  <style>
    :root {
      --ink:   #0E0E0E;
      --ink2:  #3A3530;
      --soft:  #888;
      --line:  #E8E8E8;
      --bg:    #FAFAFA;
      --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 60px;
      background: rgba(250,250,250,0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, #ff3b2f, #ff9500);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .nav-name { font-size: 16px; font-weight: 800; color: var(--ink); }
    .nav-back { font-size: 13px; color: var(--soft); text-decoration: none; }
    .nav-back:hover { color: var(--ink); }

    .wrap {
      max-width: 560px; margin: 0 auto;
      padding: 64px 24px 100px;
    }
    h1 { font-size: 32px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
    .sub { font-size: 15px; color: var(--soft); margin-bottom: 40px; line-height: 1.5; }

    .form-card {
      background: var(--white); border: 1px solid var(--line);
      border-radius: 16px; padding: 32px;
    }
    .field { margin-bottom: 20px; }
    label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--soft); margin-bottom: 7px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    input, select, textarea {
      width: 100%; padding: 11px 14px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 9px; font-size: 14px;
      font-family: -apple-system, "SF Pro Display", sans-serif;
      color: var(--ink); outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #aaa;
      background: var(--white);
    }
    textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
    .hint { font-size: 11px; color: #bbb; margin-top: 5px; }

    .submit {
      width: 100%; padding: 14px;
      background: var(--ink); color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      transition: opacity 0.15s;
    }
    .submit:hover { opacity: 0.85; }

    .success {
      display: none; text-align: center; padding: 48px 24px;
    }
    .success .icon { font-size: 40px; margin-bottom: 16px; }
    .success h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .success p { font-size: 14px; color: var(--soft); }

    footer {
      border-top: 1px solid var(--line);
      padding: 28px 40px; font-size: 12px; color: #bbb;
      display: flex; justify-content: space-between;
    }
    .footer-link { color: #bbb; text-decoration: none; }
    .footer-link:hover { color: var(--ink); }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">
    <div class="nav-icon">🎙</div>
    <span class="nav-name">Vani</span>
  </a>
  <a class="nav-back" href="help.html">← Help</a>
</nav>

<div class="wrap">
  <h1>Send Feedback</h1>
  <p class="sub">Found a bug? Have a suggestion? Just want to say hi?<br>We read everything.</p>

  <div class="form-card">
    <form id="feedbackForm" action="https://formspree.io/f/mqeownpv" method="POST">

      <div class="field">
        <label>Type</label>
        <select name="type">
          <option value="bug">🐛 Bug report</option>
          <option value="feature">💡 Feature request</option>
          <option value="feedback">💬 General feedback</option>
          <option value="other">📎 Other</option>
        </select>
      </div>

      <div class="field">
        <label>Your email <span style="font-weight:400;text-transform:none;">(optional)</span></label>
        <input type="email" name="email" placeholder="so we can follow up">
      </div>

      <div class="field">
        <label>Message</label>
        <textarea name="message" placeholder="Describe what happened, what you expected, or what you'd like to see…" required></textarea>
      </div>

      <div class="field">
        <label>Vani version <span style="font-weight:400;text-transform:none;">(optional)</span></label>
        <input type="text" name="version" placeholder="e.g. v1.0 — shown in the sidebar">
        <p class="hint">Find it at the bottom of Vani's sidebar.</p>
      </div>

      <input type="hidden" name="_subject" value="Vani Feedback">
      <button type="submit" class="submit">Send feedback →</button>
    </form>

    <div class="success" id="successMsg">
      <div class="icon">✅</div>
      <h2>Got it, thanks!</h2>
      <p>Your feedback has been received.<br>We'll be in touch if you left an email.</p>
    </div>
  </div>
</div>

<footer>
  <span>Vani · Free & open source</span>
  <a class="footer-link" href="https://github.com/varun-kaapoor/vani" target="_blank">GitHub</a>
</footer>

<script>
  document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const data = new FormData(form);
    try {
      const res = await fetch(form.action, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } });
      if (res.ok) {
        form.style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      }
    } catch(err) {
      alert('Something went wrong. Please try again.');
    }
  });
</script>

</body>
</html>
